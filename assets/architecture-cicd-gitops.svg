<svg width="1100" height="600" xmlns="http://www.w3.org/2000/svg">

<rect width="100%" height="100%" fill="#0d1117"/>

<text x="50%" y="40" fill="#00eaff" font-size="26" text-anchor="middle" font-family="Verdana">
CI/CD Pipeline with GitOps Deployment
</text>

<!-- Dev Workstation -->
<rect x="50" y="130" width="200" height="70" rx="10" fill="#22272e" stroke="#00eaff"/>
<text x="150" y="170" fill="#00eaff" font-size="15" text-anchor="middle">Developer Code Push</text>

<!-- Jenkins -->
<rect x="300" y="130" width="200" height="70" rx="10" fill="#22272e" stroke="#fca311"/>
<text x="400" y="170" fill="#fca311" text-anchor="middle">Jenkins CI Pipeline</text>

<!-- Nexus -->
<rect x="550" y="130" width="200" height="70" rx="10" fill="#22272e" stroke="#9a4dff"/>
<text x="650" y="170" fill="#9a4dff" text-anchor="middle">Artifact Registry (Nexus)</text>

<!-- ArgoCD -->
<rect x="800" y="130" width="200" height="70" rx="10" fill="#22272e" stroke="#ff006e"/>
<text x="900" y="170" fill="#ff006e" text-anchor="middle">ArgoCD GitOps Deploy</text>

<!-- Kubernetes -->
<rect x="550" y="350" width="200" height="80" rx="12" fill="#22272e" stroke="#00eaff"/>
<text x="650" y="395" fill="#00eaff" text-anchor="middle">Kubernetes Cluster</text>

<!-- Links -->
<line x1="250" y1="165" x2="300" y2="165" stroke="#00eaff" stroke-width="3"/>
<line x1="500" y1="165" x2="550" y2="165" stroke="#00eaff" stroke-width="3"/>
<line x1="750" y1="165" x2="800" y2="165" stroke="#00eaff" stroke-width="3"/>
<line x1="900" y1="200" x2="650" y2="350" stroke="#00eaff" stroke-width="3"/>

</svg>
