<svg width="1200" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .panel-strong { fill: #111827; stroke: #00e5ff; stroke-width: 1.8; }
      .box { fill: #1f2933; stroke: #4b5563; stroke-width: 1.3; }
      .box-accent { fill: #111827; stroke: #00e5ff; stroke-width: 1.5; }
      .box-ci { fill: #111827; stroke: #f59e0b; stroke-width: 1.5; }
      .box-gitops { fill: #111827; stroke: #ec4899; stroke-width: 1.5; }
      .box-db { fill: #111827; stroke: #a855f7; stroke-width: 1.5; }
      .box-sec { fill: #111827; stroke: #22c55e; stroke-width: 1.5; }
      .text-title { fill: #e5e7eb; font-family: Verdana, sans-serif; font-size: 22px; }
      .text-sub { fill: #9ca3af; font-family: Verdana, sans-serif; font-size: 14px; }
      .text-label { fill: #e5e7eb; font-family: Verdana, sans-serif; font-size: 13px; }
      .text-metric { fill: #0ea5e9; font-family: Verdana, sans-serif; font-size: 13px; }
      .line { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrow); }
      .line-strong { stroke: #00e5ff; stroke-width: 2.4; marker-end: url(#arrow); }
    </style>

    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4b5563" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" class="text-title">
    AWS EKS · Jenkins + ArgoCD · Secure Cloud-Native Platform
  </text>
  <text x="600" y="65" text-anchor="middle" class="text-sub">
    CI/CD → GitOps → EKS · AppMesh · RDS · WAF · IAM · Secrets Manager + Vault
  </text>

  <!-- CI/CD + GitOps lane (top) -->
  <rect x="40" y="90" width="1120" height="170" rx="12" class="panel" />
  <text x="60" y="115" class="text-sub">CI/CD &amp; GitOps Delivery Flow</text>

  <!-- Developer -->
  <rect x="60" y="135" width="140" height="60" rx="8" class="box" />
  <text x="130" y="165" text-anchor="middle" class="text-label">Developer</text>
  <text x="130" y="182" text-anchor="middle" class="text-sub">Code Push (Git)</text>

  <!-- Jenkins -->
  <rect x="240" y="135" width="160" height="60" rx="8" class="box-ci" />
  <text x="320" y="162" text-anchor="middle" class="text-label">Jenkins CI</text>
  <text x="320" y="178" text-anchor="middle" class="text-sub">Build · Test · Scan</text>

  <!-- SonarQube -->
  <rect x="240" y="205" width="160" height="42" rx="8" class="box" />
  <text x="320" y="230" text-anchor="middle" class="text-label">SonarQube</text>

  <!-- Nexus -->
  <rect x="440" y="135" width="160" height="60" rx="8" class="box" />
  <text x="520" y="162" text-anchor="middle" class="text-label">Nexus / Registry</text>
  <text x="520" y="178" text-anchor="middle" class="text-sub">Images &amp; Artifacts</text>

  <!-- ECR / Container Registry -->
  <rect x="440" y="205" width="160" height="42" rx="8" class="box" />
  <text x="520" y="230" text-anchor="middle" class="text-label">Amazon ECR</text>

  <!-- GitOps Repo -->
  <rect x="640" y="135" width="160" height="60" rx="8" class="box" />
  <text x="720" y="162" text-anchor="middle" class="text-label">GitOps Repo</text>
  <text x="720" y="178" text-anchor="middle" class="text-sub">Manifests · Helm</text>

  <!-- ArgoCD -->
  <rect x="840" y="135" width="160" height="60" rx="8" class="box-gitops" />
  <text x="920" y="162" text-anchor="middle" class="text-label">ArgoCD</text>
  <text x="920" y="178" text-anchor="middle" class="text-sub">Sync → EKS</text>

  <!-- CI/CD Lines -->
  <line x1="200" y1="165" x2="240" y2="165" class="line" />
  <line x1="400" y1="165" x2="440" y2="165" class="line" />
  <line x1="600" y1="165" x2="640" y2="165" class="line" />
  <line x1="800" y1="165" x2="840" y2="165" class="line" />

  <!-- AWS Cloud main panel -->
  <rect x="40" y="280" width="1120" height="360" rx="16" class="panel-strong" />
  <text x="70" y="305" class="text-sub">AWS Cloud</text>

  <!-- Left networking column -->
  <!-- Route 53 -->
  <rect x="70" y="320" width="150" height="55" rx="8" class="box" />
  <text x="145" y="350" text-anchor="middle" class="text-label">Route 53</text>

  <!-- WAF -->
  <rect x="70" y="390" width="150" height="55" rx="8" class="box-sec" />
  <text x="145" y="420" text-anchor="middle" class="text-label">AWS WAF</text>

  <!-- ALB -->
  <rect x="70" y="460" width="150" height="55" rx="8" class="box-accent" />
  <text x="145" y="490" text-anchor="middle" class="text-label">ALB</text>

  <!-- Arrows down left stack -->
  <line x1="145" y1="375" x2="145" y2="390" class="line-strong" />
  <line x1="145" y1="445" x2="145" y2="460" class="line-strong" />

  <!-- Line from ALB to Ingress -->
  <line x1="220" y1="488" x2="360" y2="488" class="line-strong" />

  <!-- EKS Cluster box -->
  <rect x="360" y="320" width="510" height="260" rx="14" class="box-accent" />
  <text x="615" y="345" text-anchor="middle" class="text-label">Amazon EKS Cluster</text>
  <text x="615" y="362" text-anchor="middle" class="text-sub">Microservices · HPA · AppMesh</text>

  <!-- Ingress -->
  <rect x="380" y="460" width="140" height="55" rx="8" class="box" />
  <text x="450" y="490" text-anchor="middle" class="text-label">Ingress / NGINX</text>

  <!-- AppMesh -->
  <rect x="550" y="400" width="160" height="55" rx="8" class="box" />
  <text x="630" y="430" text-anchor="middle" class="text-label">AWS AppMesh</text>

  <!-- Microservices row -->
  <rect x="750" y="400" width="100" height="55" rx="8" class="box" />
  <text x="800" y="428" text-anchor="middle" class="text-label">Service A</text>

  <rect x="750" y="465" width="100" height="55" rx="8" class="box" />
  <text x="800" y="493" text-anchor="middle" class="text-label">Service B</text>

  <rect x="750" y="530" width="100" height="55" rx="8" class="box" />
  <text x="800" y="558" text-anchor="middle" class="text-label">Service C</text>

  <!-- Lines inside cluster -->
  <line x1="520" y1="488" x2="550" y2="428" class="line" />
  <line x1="630" y1="428" x2="750" y2="428" class="line" />
  <line x1="630" y1="428" x2="750" y2="493" class="line" />
  <line x1="630" y1="428" x2="750" y2="558" class="line" />

  <!-- Right side: DB + Monitoring -->
  <!-- RDS -->
  <rect x="910" y="360" width="190" height="60" rx="10" class="box-db" />
  <text x="1005" y="390" text-anchor="middle" class="text-label">Amazon RDS (PostgreSQL)</text>

  <!-- CloudWatch -->
  <rect x="910" y="440" width="190" height="50" rx="10" class="box" />
  <text x="1005" y="470" text-anchor="middle" class="text-label">CloudWatch Logs &amp; Metrics</text>

  <!-- Secrets / Vault -->
  <rect x="910" y="510" width="190" height="50" rx="10" class="box-sec" />
  <text x="1005" y="535" text-anchor="middle" class="text-label">Secrets Manager + Vault</text>

  <!-- Lines from services to DB / CW / Secrets -->
  <line x1="850" y1="428" x2="910" y2="390" class="line" />
  <line x1="850" y1="493" x2="910" y2="465" class="line" />
  <line x1="850" y1="558" x2="910" y2="535" class="line" />

  <!-- Security / IAM ribbon -->
  <rect x="360" y="600" width="510" height="30" rx="8" class="box-sec" />
  <text x="615" y="620" text-anchor="middle" class="text-metric">
    IAM Roles · IRSA · Network Policies · TLS · Policy-as-Code · Image Scanning
  </text>
</svg>
